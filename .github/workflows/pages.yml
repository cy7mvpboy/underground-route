# Deploy the web app (web/) to GitHub Pages.
# web/index.html is written as a page fragment (it is also published as a
# claude.ai Artifact, which adds its own document wrapper), so this job wraps
# it in a full HTML document before uploading.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          { echo '<!doctype html>'; echo '<html lang="ko">'; cat web/index.html; echo '</html>'; } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
