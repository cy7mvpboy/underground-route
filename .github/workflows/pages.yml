# Deploy the web app (web/) to GitHub Pages.
# web/index.html is written as a page fragment (it is also published as a
# claude.ai Artifact, which adds its own document wrapper), so this job wraps
# it in a full HTML document before uploading.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          { echo '<!doctype html>'; echo '<html lang="ko">'; cat web/index.html; echo '</html>'; } > _site/index.html
          # Cache-busting: GitHub Pages caches files for 10 minutes, so tag every
          # script URL with the commit id to keep page and scripts from the same deploy.
          sed -i "s#src=\"js/\([a-z0-9_-]*\)\.js\"#src=\"js/\1.js?v=${GITHUB_SHA::7}\"#g" _site/index.html
          # Offline (web/sw.js): stamp the service worker with the same commit id. The changed sw.js makes
          # browsers install the new version in the background; it checks that the page carries the same ?v=.
          sed -i "s/^const VERSION = '__VERSION__';/const VERSION = '${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::7}';" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
