<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지하로 3D · 공덕 → 수서</title>
<meta name="description" content="지하로 시연 이야기를 3D로: 공덕역에서 수서역까지 지하로, 한강 아래 하저터널 두 곳">
<meta name="theme-color" content="#0B1214">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
/* 색은 앱(web/index.html)의 디자인 토큰과 같다: 청록 = 지하, 주황빨강 = 지상 노출·막힘 */
:root {
  --bg: #0B1214; --surface: #121C1F; --line: #24363B; --line-strong: #3A5257;
  --text: #E8F1EF; --muted: #9FB3B0; --safe: #2EC4B6; --route-safe: #3FE6D5;
  --expo: #FF5A36; --expo-text: #FF6A49; --river: #8EC5FF; --focus: #FFE066;
  --font: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; word-break: keep-all; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 6px;
  background: rgb(11 18 20 / .72); color: var(--text); white-space: nowrap; will-change: transform; }
.lb.est { color: var(--muted); }
.lb.red { color: var(--expo-text); border: 1px solid var(--expo); font-weight: 700; }
.lb.river { background: none; color: var(--river); font-size: 13px; }
.lb.dim { background: none; color: var(--muted); }

/* 위: 제목 · 앱으로 · 깊이 과장 안내 */
.top { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top)); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; pointer-events: none; }
.top h1 { margin: 0; font-size: 15px; font-weight: 700; }
.top p { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
.top a { pointer-events: auto; flex: none; font-size: 13px; color: var(--route-safe); text-decoration: none;
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; background: rgb(11 18 20 / .7); }
.top a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 아래: 자막 · 조작 */
.panel { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto;
  background: rgb(18 28 31 / .86); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(6px); }
.cap { margin: 0; font-size: clamp(17px, 4.6vw, 21px); font-weight: 700; line-height: 1.3; }
.sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; min-height: 1.45em; }
.where { margin: 8px 0 0; font-size: 12px; color: var(--route-safe); display: flex; gap: 8px; align-items: center; min-height: 1.4em; }
.ff { font-size: 11px; color: var(--bg); background: var(--route-safe); border-radius: 4px; padding: 0 5px; font-weight: 700; }
.ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.ctl button { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ctl svg { width: 18px; height: 18px; }
.bar { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.bar i { display: block; height: 4px; width: 100%; border-radius: 2px; background: var(--line-strong); position: relative; overflow: hidden; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--route-safe); }
.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
@media (min-width: 900px) { .panel { left: 24px; right: auto; bottom: 24px; width: 560px; } .top { left: 24px; right: 24px; top: 20px; } }
</style>
<!-- three.js 0.170.0: 본체는 cdnjs, OrbitControls 는 cdnjs 에 없어 jsDelivr(같은 판) -->
<script type="importmap">
{ "imports": {
  "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="공덕역에서 수서역까지 지하 이동 3D 그림"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="top">
  <h1 id="title">지하로 3D · 공덕 → 수서</h1>
  <a href="../">지하로 앱 열기</a>
  <p>깊이 ×<span id="exag">10</span> · 승강장 깊이는 서울교통공사 자료(1~8호선, 9호선 2·3단계)<br>역 구조는 개략(승강장 깊이만 실제) · 터널·한강 아래 깊이는 추정</p>
</div>
<section class="panel">
  <p class="cap" id="cap" aria-live="polite">불러오는 중</p>
  <p class="sub" id="sub"></p>
  <p class="where" id="where"></p>
  <div class="ctl">
    <button id="play" type="button" aria-label="멈춤"></button>
    <button id="restart" type="button" aria-label="처음부터"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4.5H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="bar" id="bar" role="slider" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i><b id="prog"></b></i></div>
    <span class="time" id="time"></span>
  </div>
</section>
<script type="module" src="ride.js"></script>
</body>
</html>
